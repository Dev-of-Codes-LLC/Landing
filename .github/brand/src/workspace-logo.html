<!DOCTYPE html>
<!-- Google Workspace logo (Admin console → Account → Account settings → Personalization), 320×132 at 1x.
     A dark tile so it reads on Gmail's light and dark headers alike; flat colour keeps the file small. -->
<html lang="en"><head><meta charset="UTF-8"><title>workspace-logo</title>
<link rel="stylesheet" href="brand.css">
<style>
.card { width: 320px; height: 132px; border-radius: 18px; background: var(--bg-base); display: grid; place-items: center; }
.lockup { font-size: 30px; gap: 0.45em; color: var(--text-primary); }
.lockup .mark { font-size: 32px; }
</style></head>
<body>
<div class="card"><div class="lockup"><span class="mark">D&lt;</span><span>DevOfCodes</span></div></div>
</body></html>
