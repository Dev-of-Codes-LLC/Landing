<!DOCTYPE html>
<!-- Link preview for devofcodes.com (og:image), 1200×630. render.mjs captures .card at 1x. -->
<html lang="en"><head><meta charset="UTF-8"><title>og</title>
<link rel="stylesheet" href="brand.css">
<style>
.card { width: 1200px; height: 630px; padding: 64px 72px; display: flex; flex-direction: column; }
.lockup { font-size: 26px; }
.lockup .mark { font-size: 28px; }
.eyebrow { font-size: 15px; margin-top: auto; }
.eyebrow { color: var(--text-secondary); }
.headline { font-size: 96px; margin-top: 22px; white-space: nowrap; }
.bottom { display: flex; justify-content: space-between; align-items: center; margin-top: auto; padding-top: 28px; border-top: 1px solid var(--border-bright); font-family: var(--font-mono); font-size: 18px; color: var(--text-secondary); }
.site { color: var(--accent-amber); font-weight: 500; letter-spacing: 0.04em; }
</style></head>
<body>
<div class="card surface">
  <div class="lockup"><span class="mark">D&lt;</span><span>DevOfCodes</span></div>
  <div class="eyebrow"><span class="dot"></span><span>Available for contract work</span><span class="sep">/</span><span>San Diego, CA</span></div>
  <h1 class="headline"><span class="line">Work you can</span><span class="line">inspect.</span></h1>
  <div class="bottom"><span>A one-person software company</span><span class="site">devofcodes.com →</span></div>
</div>
</body></html>
