# Deploys the site to devofcodes.com (S3 + CloudFront in the prod account).
# The infrastructure lives in the private repo
# Dev-of-Codes-LLC/devofcodes-infra (modules/static-site); the deploy role
# trusts only jobs in this repository's prod environment, which only main
# may use, and can only write the site bucket and invalidate its distribution.
# The role, bucket and distribution are secrets on the prod environment, so
# this file names none of them and run logs show them as ***.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: prod
      url: https://devofcodes.com
    # Environment secrets resolve only inside a job that names the environment,
    # so these sit on the job, not the workflow.
    env:
      AWS_REGION: us-west-2
      ROLE_ARN: ${{ secrets.DEPLOY_ROLE_ARN }}
      BUCKET: ${{ secrets.SITE_BUCKET }}
      DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
    steps:
      - name: Check the deploy secrets are set
        run: |
          missing=""
          for v in ROLE_ARN BUCKET DISTRIBUTION_ID; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing on the prod environment:$missing. Set DEPLOY_ROLE_ARN, SITE_BUCKET and CLOUDFRONT_DISTRIBUTION_ID under Settings > Environments > prod."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Unbalanced CSS stops the release before anything reaches the bucket
      # (check.yml runs the same check on every pull request).
      - name: Check the pages' CSS braces are balanced
        run: node .github/scripts/check-css.mjs

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Pacific time, where the site is run from. A UTC date reads as tomorrow
      # for any deploy after 5 pm, which a status board cannot afford.
      - name: Stamp the deploy date into the home page
        run: |
          today=$(TZ=America/Los_Angeles date +'%b %-d, %Y')
          sed -i "s#<!--deploy-date-->.*<!--/deploy-date-->#<!--deploy-date-->${today}<!--/deploy-date-->#" index.html
          grep -o '<!--deploy-date-->[^<]*<!--/deploy-date-->' index.html

      # The home page's "Latest in the log" list is the newest three entries of
      # changelog.html. A log entry without an id stops the deploy, by design:
      # the id is the entry's link from the home page.
      - name: Copy the newest log entries onto the home page
        run: node .github/scripts/build-log.mjs

      # The toolkit page's cards, counts, rules and install commands come from
      # Dev-of-Codes-LLC/agent-toolkit's docs/site.json at deploy time. If the
      # catalog cannot be read, the committed cards are kept and the run shows a
      # warning. After a toolkit change, run this workflow by hand to refresh.
      - name: Build the toolkit page from agent-toolkit's catalog
        run: node .github/scripts/build-toolkit.mjs --fail-soft

      # Excluded prefixes are also excluded from --delete, so anything that
      # once reached the bucket under them is removed explicitly.
      - name: Remove files that must never be served
        run: aws s3 rm "s3://${BUCKET}/.claude" --recursive

      - name: Upload site
        run: |
          aws s3 sync . "s3://${BUCKET}" --delete \
            --exclude ".git/*" --exclude ".github/*" --exclude ".claude/*" \
            --exclude "*.md" --exclude ".gitignore" \
            --cache-control "public, max-age=300"

      - name: Invalidate CloudFront
        run: |
          id=$(aws cloudfront create-invalidation --distribution-id "${DISTRIBUTION_ID}" \
            --paths "/*" --query Invalidation.Id --output text)
          aws cloudfront wait invalidation-completed --distribution-id "${DISTRIBUTION_ID}" --id "$id"
          echo "Invalidation $id complete"
